<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f8ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="설교 노트" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // 첫 화면이 깜빡이지 않게, 저장해 둔 분위기를 먼저 적용
      try {
        var t = JSON.parse(localStorage.getItem('sermon-settings-v1') || '{}').theme;
        document.documentElement.setAttribute('data-theme', t === 'chic' || t === 'warm' ? t : 'fresh');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'fresh');
      }
    </script>
    <title>설교 노트</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
